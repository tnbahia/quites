<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quites · divisão de despesas em grupo</title>
  <meta name="description" content="Divide despesas com amigos e descobre quem paga a quem. Corre no teu browser: sem conta, sem servidor, os dados ficam contigo.">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://gc.zgo.at; connect-src 'self' https://quites.goatcounter.com/count; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Ccircle cx='24' cy='32' r='15' fill='%23fff'/%3E%3Ccircle cx='40' cy='32' r='15' fill='%23fbbf24' fill-opacity='.92'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap hero">
      <div class="hero-text">
        <div class="brand">
          <svg class="mark" id="mark" viewBox="0 0 64 40" aria-hidden="true" focusable="false">
            <g class="left"><circle cx="22" cy="20" r="18" fill="#fff"/><g class="lace" fill="#be123c"><path d="M5.42 27A18 18 0 0 0 38.58 27Z"/><circle cx="7.50" cy="27" r="2.3"/><circle cx="11.65" cy="27" r="2.3"/><circle cx="15.80" cy="27" r="2.3"/><circle cx="19.95" cy="27" r="2.3"/><circle cx="24.10" cy="27" r="2.3"/><circle cx="28.25" cy="27" r="2.3"/><circle cx="32.40" cy="27" r="2.3"/><circle cx="36.55" cy="27" r="2.3"/><circle cx="13.70" cy="30.4" r="0.95" fill="#fff"/><circle cx="17.85" cy="30.4" r="0.95" fill="#fff"/><circle cx="22.00" cy="30.4" r="0.95" fill="#fff"/><circle cx="26.15" cy="30.4" r="0.95" fill="#fff"/><circle cx="30.30" cy="30.4" r="0.95" fill="#fff"/><circle cx="15.77" cy="33.6" r="0.95" fill="#fff"/><circle cx="19.92" cy="33.6" r="0.95" fill="#fff"/><circle cx="24.07" cy="33.6" r="0.95" fill="#fff"/><circle cx="28.22" cy="33.6" r="0.95" fill="#fff"/></g><circle class="nip" cx="22" cy="20" r="3.4" fill="#c26a5a"/></g>
            <g class="right"><circle cx="42" cy="20" r="18" fill="#fbbf24"/><g class="lace" fill="#be123c"><path d="M25.42 27A18 18 0 0 0 58.58 27Z"/><circle cx="27.50" cy="27" r="2.3"/><circle cx="31.65" cy="27" r="2.3"/><circle cx="35.80" cy="27" r="2.3"/><circle cx="39.95" cy="27" r="2.3"/><circle cx="44.10" cy="27" r="2.3"/><circle cx="48.25" cy="27" r="2.3"/><circle cx="52.40" cy="27" r="2.3"/><circle cx="56.55" cy="27" r="2.3"/><circle cx="33.70" cy="30.4" r="0.95" fill="#fbbf24"/><circle cx="37.85" cy="30.4" r="0.95" fill="#fbbf24"/><circle cx="42.00" cy="30.4" r="0.95" fill="#fbbf24"/><circle cx="46.15" cy="30.4" r="0.95" fill="#fbbf24"/><circle cx="50.30" cy="30.4" r="0.95" fill="#fbbf24"/><circle cx="35.77" cy="33.6" r="0.95" fill="#fbbf24"/><circle cx="39.92" cy="33.6" r="0.95" fill="#fbbf24"/><circle cx="44.07" cy="33.6" r="0.95" fill="#fbbf24"/><circle cx="48.22" cy="33.6" r="0.95" fill="#fbbf24"/></g><circle class="nip" cx="42" cy="20" r="3.4" fill="#b45309"/></g>
            <path class="lens" d="M32 5.03A18 18 0 0 1 32 34.97A18 18 0 0 1 32 5.03Z" fill="#0a4f49"/>
            <path class="tick" pathLength="1" d="M27.5 20.5 31.5 24.5 37.5 15.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1 translate="no">Quites</h1>
        </div>
        <p class="tagline" data-t="tagline">Paga o que deves. Ficamos quites.</p>
        <div class="toolbar" role="toolbar" aria-label="Ações do grupo" data-t-label="toolbarLabel">
          <details class="menu" id="menu-more">
            <summary data-t="more">Mais</summary>
            <div class="menu-list">
              <button type="button" id="btn-share" data-t="share">Partilhar uma cópia por link</button>
              <button type="button" id="btn-export" data-t="export">Exportar para ficheiro</button>
              <button type="button" id="btn-import" data-t="import">Importar de ficheiro</button>
              <button type="button" id="btn-demo" data-t="demo">Ver exemplo</button>
              <button type="button" id="btn-clear" class="danger" data-t="clear">Começar de novo</button>
            </div>
          </details>
          <input type="file" id="file-import" accept="application/json,.json" hidden>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>

    <section aria-labelledby="h-group">
      <h2 id="h-group" data-t="groupHeading">Grupo</h2>
      <label class="field">
        <span data-t="groupNameLabel">Nome (opcional)</span>
        <input id="group-name" type="text" maxlength="80" autocomplete="off" placeholder="Ex.: Fim de semana na serra" data-t-ph="groupNamePh">
      </label>
    </section>

    <section aria-labelledby="h-people">
      <h2 id="h-people"><span class="step">1</span> <span data-t="peopleHeading">Pessoas</span></h2>
      <form id="person-form" class="row" autocomplete="off">
        <label class="field grow">
          <span class="sr-only" data-t="personNameLabel">Nome da pessoa</span>
          <input id="person-name" type="text" maxlength="60" placeholder="Nome" data-t-ph="personNamePh" required>
        </label>
        <button type="submit" class="primary" data-t="addPerson">Adicionar</button>
      </form>
      <ul id="people-list" class="chips"></ul>
    </section>

    <section aria-labelledby="h-expenses">
      <h2 id="h-expenses"><span class="step">2</span> <span data-t="expensesHeading">Despesas</span></h2>
      <p id="expenses-hint" class="hint" data-t="needPeopleFirst" hidden>Adiciona primeiro as pessoas do grupo.</p>
      <form id="expense-form" autocomplete="off">
        <div class="grid">
          <label class="field">
            <span data-t="descLabel">Descrição</span>
            <input id="exp-desc" type="text" maxlength="100" placeholder="Ex.: Jantar" data-t-ph="descPh">
          </label>
          <label class="field">
            <span data-t="amountLabel">Valor (€)</span>
            <input id="exp-amount" type="text" inputmode="decimal" placeholder="0,00" required>
          </label>
          <label class="field">
            <span data-t="payerLabel">Pago por</span>
            <select id="exp-payer" required></select>
          </label>
        </div>
        <fieldset class="field">
          <legend data-t="participantsLegend">Quem participa</legend>
          <div class="row tight">
            <button type="button" id="btn-all" class="small" data-t="all">Todos</button>
            <button type="button" id="btn-none" class="small" data-t="none">Ninguém</button>
          </div>
          <div id="exp-participants" class="checks"></div>
        </fieldset>
        <div class="row">
          <button type="submit" id="btn-save-expense" class="primary" data-t="addExpense">Adicionar despesa</button>
          <button type="button" id="btn-cancel-edit" data-t="cancel" hidden>Cancelar</button>
        </div>
      </form>
      <ul id="expenses-list" class="list"></ul>
    </section>

    <section aria-labelledby="h-settle">
      <h2 id="h-settle"><span class="step">3</span> <span data-t="settleHeading">Acerto de contas</span></h2>
      <div id="settle"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p class="support"><span data-t="supportAsk">Isto foi útil?</span> <a href="https://ko-fi.com/snowbay" target="_blank" rel="noopener noreferrer" data-t="supportLink">Paga-me um café</a></p>
    <p><span data-t="footData">Os dados ficam só neste browser.</span> <a href="https://github.com/tnbahia/quites" data-t="footCode">Código no GitHub</a> <span data-t="footLicense">· licença MIT</span></p>
  </footer>
  <script data-goatcounter="https://quites.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
