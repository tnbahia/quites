<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quites · divisão de despesas em grupo</title>
  <meta name="description" content="Divide despesas com amigos e descobre quem paga a quem. Corre no teu browser: sem conta, sem servidor, os dados ficam contigo.">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%9D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>Quites</h1>
        <p class="tagline">Paga o que deves. Ficamos quites.</p>
      </div>
      <div class="toolbar" role="toolbar" aria-label="Ações do grupo">
        <button type="button" id="btn-share" class="primary">Copiar link do grupo</button>
        <details class="menu" id="menu-more">
          <summary>Mais</summary>
          <div class="menu-list">
            <button type="button" id="btn-export">Exportar para ficheiro</button>
            <button type="button" id="btn-import">Importar de ficheiro</button>
            <button type="button" id="btn-demo">Ver exemplo</button>
            <button type="button" id="btn-clear" class="danger">Começar de novo</button>
          </div>
        </details>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>

    <section aria-labelledby="h-group">
      <h2 id="h-group">Grupo</h2>
      <label class="field">
        <span>Nome (opcional)</span>
        <input id="group-name" type="text" maxlength="80" autocomplete="off" placeholder="Ex.: Fim de semana na serra">
      </label>
    </section>

    <section aria-labelledby="h-people">
      <h2 id="h-people"><span class="step">1</span> Pessoas</h2>
      <form id="person-form" class="row" autocomplete="off">
        <label class="field grow">
          <span class="sr-only">Nome da pessoa</span>
          <input id="person-name" type="text" maxlength="60" placeholder="Nome" required>
        </label>
        <button type="submit" class="primary">Adicionar</button>
      </form>
      <ul id="people-list" class="chips"></ul>
    </section>

    <section aria-labelledby="h-expenses">
      <h2 id="h-expenses"><span class="step">2</span> Despesas</h2>
      <p id="expenses-hint" class="hint" hidden>Adiciona primeiro as pessoas do grupo.</p>
      <form id="expense-form" autocomplete="off">
        <div class="grid">
          <label class="field">
            <span>Descrição</span>
            <input id="exp-desc" type="text" maxlength="100" placeholder="Ex.: Jantar">
          </label>
          <label class="field">
            <span>Valor (€)</span>
            <input id="exp-amount" type="text" inputmode="decimal" placeholder="0,00" required>
          </label>
          <label class="field">
            <span>Pago por</span>
            <select id="exp-payer" required></select>
          </label>
        </div>
        <fieldset class="field">
          <legend>Quem participa</legend>
          <div class="row tight">
            <button type="button" id="btn-all" class="small">Todos</button>
            <button type="button" id="btn-none" class="small">Ninguém</button>
          </div>
          <div id="exp-participants" class="checks"></div>
        </fieldset>
        <div class="row">
          <button type="submit" id="btn-save-expense" class="primary">Adicionar despesa</button>
          <button type="button" id="btn-cancel-edit" hidden>Cancelar</button>
        </div>
      </form>
      <ul id="expenses-list" class="list"></ul>
    </section>

    <section aria-labelledby="h-settle">
      <h2 id="h-settle"><span class="step">3</span> Acerto de contas</h2>
      <div id="settle"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p>Os dados ficam só neste browser. <a href="https://github.com/tnbahia/quites">Código no GitHub</a> · licença MIT</p>
  </footer>
</body>
</html>
